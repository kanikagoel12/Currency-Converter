<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Currency Converter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="bg-mesh" aria-hidden="true"></div>
    <div class="bg-grid" aria-hidden="true"></div>

    <main class="shell">
        <header class="brand">
            <span class="brand-mark" aria-hidden="true">
                <i class="fa-solid fa-earth-americas"></i>
            </span>
            <div class="brand-text">
                <h1>GlobalFX</h1>
                <p class="tagline">Real-time Currency Conversion</p>
            </div>
        </header>

        <div class="card">
            <form id="converter-form">
                <div class="field amount">
                    <label class="field-label" for="amount-input">Amount</label>
                    <div class="input-wrap">
                        <span class="input-prefix" aria-hidden="true"><i class="fa-solid fa-wallet"></i></span>
                        <input id="amount-input" name="amount" value="100" type="number" inputmode="decimal" autocomplete="off" min="1">
                    </div>
                </div>

                <div class="pair-row dropdown">
                    <div class="pair-col from">
                        <span class="field-label">From</span>
                        <div class="select-container from-box">
                            <img src="https://flagsapi.com/US/flat/64.png" alt="" width="32" height="24">
                            <select name="from" aria-label="Convert from currency"></select>
                            <i class="fa-solid fa-chevron-down" style="color: var(--text-muted); font-size: 0.8rem; margin-right: 0.2rem;"></i>
                        </div>
                    </div>

                    <div class="swap-visual" aria-hidden="true" title="Swap Currencies" id="swap-btn">
                        <i class="fa-solid fa-right-left"></i>
                    </div>

                    <div class="pair-col to">
                        <span class="field-label">To</span>
                        <div class="select-container to-box">
                            <img src="https://flagsapi.com/IN/flat/64.png" alt="" width="32" height="24">
                            <select name="to" aria-label="Convert to currency"></select>
                            <i class="fa-solid fa-chevron-down" style="color: var(--text-muted); font-size: 0.8rem; margin-right: 0.2rem;"></i>
                        </div>
                    </div>
                </div>

                <div class="msg" role="status" aria-live="polite">Getting exchange rate...</div>

                <button type="submit" class="cta">
                    <span>Convert Now</span>
                    <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
                </button>
            </form>
        </div>

        <p class="footnote">Live rates from public API. Intended for reference only.</p>
    </main>
    <script src="codes.js"></script>
    <script src="one.js"></script>
</body>
</html>
